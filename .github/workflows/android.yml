name: Android CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Serialize builds per ref: back-to-back pushes to main queue up instead
# of racing each other into publishing the same release twice. Never
# cancel an in-flight build - it may be the one that publishes.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # v0.4.3: shallow checkout. The git-history signing fallback is
          # GONE - signing material comes ONLY from GitHub Secrets
          # (docs/KEY_ROTATION.md). History is never read for secrets.
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned so CI matches the locally tested SDK exactly.
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Flutter version
        run: flutter --version

      # If the android/ platform folder has not been committed yet
      # (bootstrap step on a fresh clone), generate it with our config.
      - name: Ensure android platform folder
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms android --project-name ruby_invoice --org com.rubyinvoice
            bash tool/apply_android_config.sh
          fi

      - name: Install dependencies
        run: flutter pub get

      # BLOCKER-1 (v0.4.3) - KEY ROTATION DONE, FALLBACK REMOVED.
      # The rotated NEW keystore arrives from GitHub Secrets ONLY.
      # Fail loudly when it is missing: NO git-history fallback exists
      # anymore (the old key + passwords were public in history, which is
      # exactly why this repo rotated to a new key via apksigner lineage).
      - name: Restore rotated signing keystore (secrets only)
        run: |
          # DIAGNOSTIC - which of the 5 expected secrets actually resolve
          # inside THIS run. Values are never printed; for the two base64
          # blobs only the character LENGTH is shown (full = 3740 / 3696)
          # to detect truncated or mis-pasted values. If a secret shows
          # EMPTY here while the web UI lists it, its stored NAME differs
          # from the expected one (invisible char from mobile autocorrect)
          # or its VALUE was saved empty -> delete + recreate that secret.
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] \
            && echo "presence: ANDROID_KEYSTORE_BASE64 = SET ($(printf '%s' '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | wc -c | tr -d ' ') chars; full = 3740)" \
            || echo "presence: ANDROID_KEYSTORE_BASE64 = EMPTY/MISSING  <-- recreate this secret"
          [ -n "${{ secrets.ANDROID_OLD_KEYSTORE_BASE64 }}" ] \
            && echo "presence: ANDROID_OLD_KEYSTORE_BASE64 = SET ($(printf '%s' '${{ secrets.ANDROID_OLD_KEYSTORE_BASE64 }}' | wc -c | tr -d ' ') chars; full = 3696)" \
            || echo "presence: ANDROID_OLD_KEYSTORE_BASE64 = EMPTY/MISSING (optional)"
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && echo "presence: ANDROID_KEYSTORE_PASSWORD = SET" || echo "presence: ANDROID_KEYSTORE_PASSWORD = EMPTY/MISSING"
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && echo "presence: ANDROID_KEY_ALIAS = SET" || echo "presence: ANDROID_KEY_ALIAS = EMPTY/MISSING"
          [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && echo "presence: ANDROID_KEY_PASSWORD = SET" || echo "presence: ANDROID_KEY_PASSWORD = EMPTY/MISSING"
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is NOT set (resolved to empty at runtime). The history fallback was removed in v0.4.3."
            echo "  CHECK 1: Settings -> Secrets and variables -> ACTIONS section (NOT Codespaces, NOT Dependabot), Secrets tab."
            echo "  CHECK 2: The NAME must be EXACTLY 'ANDROID_KEYSTORE_BASE64' (uppercase, underscores, no spaces)."
            echo "  CHECK 3: The secret VALUE is the full base64 of ruby-invoice-v2.keystore (one long line) - see docs/KEY_ROTATION.md."
            echo "  CHECK 4: After adding secrets, trigger a FRESH run (Re-run all jobs on the latest run, or push)."
            exit 1
          fi
          if ! echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/ruby-invoice-v2.keystore 2>/tmp/b64err; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is NOT valid base64 - the value got mangled/truncated while pasting (common on phone)."
            cat /tmp/b64err
            echo "FIX: open the ANDROID_KEYSTORE_BASE64.txt download link in Chrome -> long-press -> Select all -> Copy -> paste into the secret -> Update secret."
            exit 1
          fi
          echo "decoded ANDROID_KEYSTORE_BASE64: $(wc -c < android/app/ruby-invoice-v2.keystore) bytes (expected 2804 = ruby-invoice-v2.keystore)"
          {
            echo "storeFile=ruby-invoice-v2.keystore"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > android/key.properties
          # Prove the NEW keystore actually opens with the provided password
          # and alias - catches swapped/misplaced secret values HERE with a
          # clear message instead of an opaque failure at the signing step.
          if ! keytool -list -keystore android/app/ruby-invoice-v2.keystore \
                -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
                -storetype PKCS12 -alias "${{ secrets.ANDROID_KEY_ALIAS }}" > /tmp/kt-new.log 2>&1; then
            echo "::error::NEW keystore does NOT open with the provided ANDROID_KEYSTORE_PASSWORD + ANDROID_KEY_ALIAS."
            echo "Most likely the two base64 values got swapped between the two secrets, or a paste typo. keytool says:"
            cat /tmp/kt-new.log
            exit 1
          fi
          echo "NEW keystore OK: opens with the provided password, alias present ($(grep -c PrivateKeyEntry /tmp/kt-new.log) PrivateKeyEntry)."
          echo "Rotated keystore restored from GitHub Secrets."

      # OPTIONAL 5th secret (Android 7/8 update compatibility): the
      # RETIRED old keystore signs the v2 band (API 24-27) so phones on
      # Android 7/8 keep taking in-place updates. Its password is already
      # public in git history (retired key) - hardcoding it here exposes
      # nothing new. Without the secret, the APK is new-key-only: Android
      # 9+ STILL updates (v3 lineage), Android 7/8 needs one
      # uninstall+reinstall (data returns from cloud sync).
      - name: Restore retired old keystore (optional, Android 7/8 band)
        run: |
          if [ -n "${{ secrets.ANDROID_OLD_KEYSTORE_BASE64 }}" ]; then
            if echo "${{ secrets.ANDROID_OLD_KEYSTORE_BASE64 }}" | base64 -d > /tmp/old-key.keystore 2>/tmp/b64old; then
              echo "decoded ANDROID_OLD_KEYSTORE_BASE64: $(wc -c < /tmp/old-key.keystore) bytes (expected 2772 = retired old keystore)"
              if keytool -list -keystore /tmp/old-key.keystore -storepass rubyinvoice \
                    -storetype PKCS12 -alias ruby_invoice > /tmp/kt-old.log 2>&1; then
                echo "OLD keystore OK: opens with the public legacy password."
                echo "OLD_KEYSTORE_AVAILABLE=true" >> "$GITHUB_ENV"
              else
                echo "::warning::ANDROID_OLD_KEYSTORE_BASE64 decoded but does NOT open with the legacy password - value looks swapped or mis-pasted. Skipping the Android 7/8 band (new-key-only APK)."
                cat /tmp/kt-old.log
                echo "OLD_KEYSTORE_AVAILABLE=false" >> "$GITHUB_ENV"
              fi
            else
              echo "::warning::ANDROID_OLD_KEYSTORE_BASE64 is not valid base64 - skipping the Android 7/8 band."
              cat /tmp/b64old
              echo "OLD_KEYSTORE_AVAILABLE=false" >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::ANDROID_OLD_KEYSTORE_BASE64 not set - Android 7/8 (API 24-27) users will need one uninstall+reinstall to update."
            echo "OLD_KEYSTORE_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.log

      # v0.2.20: engine regression tests (fresh-db open, corrupt-file
      # quarantine, dirty flags) on the Dart VM via sqflite_common_ffi.
      # A red test stops the APK from building at all.
      - name: Run engine tests
        run: flutter test

      # Analyze failures leave no build log behind - publish the analyzer
      # output to the ci-logs branch so it is readable via
      # raw.githubusercontent.com without any API rate limits.
      - name: Summarize analyze failure
        if: failure()
        run: |
          if [ -f /tmp/build_full.log ]; then
            echo 'Build log exists - failure happened after analyze, skipping.'; exit 0
          fi
          if [ -f /tmp/analyze.log ]; then
            {
              echo '## Analyze failure'
              tail -60 /tmp/analyze.log
            } >> "$GITHUB_STEP_SUMMARY" || true
            mkdir -p /tmp/logrepo && cd /tmp/logrepo
            git init -q
            git config user.email "ci@rubyinvoice.local" && git config user.name "CI Bot"
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            cp /tmp/analyze.log analyze.log
            git add analyze.log
            git commit -qm "CI analyze log for ${{ github.sha }}"
            git branch -M ci-logs
            git push -f origin ci-logs || true
          fi

      # The Flutter-gradle plugin requires the NDK matching flutter.ndkVersion
      # (28.2.13676358 for Flutter 3.50.0). Runners do not always ship that
      # exact version, and a failed auto-install breaks configuration with
      # "sdkmanager finished with non-zero exit value 1". Install it explicitly.
      - name: Install NDK (flutter.ndkVersion)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      # Fallback mirror for Maven Central throttling (repo.maven.apache.org
      # sometimes 429s shared runner IPs). Applied as a Gradle init script so
      # it also covers the buildscript classpaths of vendor plugins
      # (cloud_firestore etc.), which declare their own repositories.
      - name: Configure Maven Central mirror fallback
        run: |
          mkdir -p ~/.gradle/init.d
          {
            echo "gradle.projectsLoaded {"
            echo "    rootProject.allprojects {"
            echo "        buildscript {"
            echo "            repositories {"
            echo "                maven { url = uri('https://repo1.maven.org/maven2') }"
            echo "            }"
            echo "        }"
            echo "    }"
            echo "}"
          } > ~/.gradle/init.d/mirror-fallback.gradle

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build_full.log

      # BLOCKER-1 (v0.4.3) - FINAL ROTATED SIGNATURE (proven in sandbox).
      # apksigner REPLACES the gradle intermediate signature with:
      #   * API 24-27: v2 signed by the RETIRED old key -> Android 7/8
      #     in-place updates keep working (old cert == installed cert).
      #   * API 28+:   v3 signed by the NEW key + proof-of-rotation
      #     lineage (android/lineage, committed - it is public by design:
      #     it ships inside every v3-signed APK). rotation-min-sdk 28
      #     makes the NEW key authoritative from Android 9 up, so the
      #     leaked old key can no longer push updates to API 28+ users.
      - name: Apply rotated signature (apksigner + lineage)
        run: |
          set -o pipefail
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          echo "apksigner: $APKSIGNER ($($APKSIGNER --version))"
          APK=build/app/outputs/flutter-apk/app-release.apk
          NEW_KS=android/app/ruby-invoice-v2.keystore
          NEW_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          NEW_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          if [ "$OLD_KEYSTORE_AVAILABLE" = "true" ]; then
            "$APKSIGNER" sign \
              --ks /tmp/old-key.keystore --ks-key-alias ruby_invoice \
                --ks-pass pass:rubyinvoice --key-pass pass:rubyinvoice \
              --next-signer \
              --ks "$NEW_KS" --ks-key-alias "$NEW_ALIAS" \
                --ks-pass pass:"$NEW_PASS" \
              --lineage android/lineage \
              --rotation-min-sdk-version 28 \
              --out "${APK}.rotated" "$APK"
          else
            "$APKSIGNER" sign \
              --ks "$NEW_KS" --ks-key-alias "$NEW_ALIAS" \
                --ks-pass pass:"$NEW_PASS" \
              --lineage android/lineage \
              --rotation-min-sdk-version 28 \
              --out "${APK}.rotated" "$APK"
          fi
          mv "${APK}.rotated" "$APK"
          echo "=== signature proof (CI log) ==="
          "$APKSIGNER" verify --print-certs --min-sdk-version 24 "$APK"
          "$APKSIGNER" verify --min-sdk-version 28 "$APK" > /dev/null && echo "v3 lineage verify OK (API 28+)"

      # Surface the real gradle error on the run page (step summaries are
      # visible even when the raw log is too large for the UI to render).
      - name: Summarize build failure
        if: failure()
        run: |
          if [ ! -f /tmp/build_full.log ]; then
            echo 'No build log (build step never started).'; exit 0
          fi
          {
            echo '## Build failure (log tail)'
            grep -B4 -A25 -E "What went wrong|FAILURE: Build failed|Caused by|error:" /tmp/build_full.log | tail -150
          } >> "$GITHUB_STEP_SUMMARY" || tail -80 /tmp/build_full.log >> "$GITHUB_STEP_SUMMARY"
          # Publish the failure log to the ci-logs branch so it is readable
          # via raw.githubusercontent.com without any API rate limits.
          mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q
          git config user.email "ci@rubyinvoice.local" && git config user.name "CI Bot"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          tail -200 /tmp/build_full.log > failure.log
          git add failure.log
          git commit -qm "CI failure log for ${{ github.sha }}"
          git branch -M ci-logs
          git push -f origin ci-logs || true

      - name: Upload full build log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build_full.log

      - name: Upload APK artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: ruby-invoice-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # GOAL 3 (v0.4.1): archive the R8 mapping.txt with every build so
      # obfuscated Java/Kotlin stack traces from Crashlytics can be
      # re-traced later. warn-only: a config change must never break CI.
      # (v0.4.3 note: the rotated signature step above runs BEFORE the
      # APK artifact upload, so every published APK carries the lineage.)
      - name: Upload R8 mapping.txt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-txt
          path: build/app/outputs/mapping/**/mapping.txt
          if-no-files-found: warn

      # AUTO-RELEASE (v0.4.3-fix): until now a release was published ONLY
      # on a MANUAL "git push origin v0.4.x" tag push. v0.4.1/0.4.2/0.4.3
      # were never tagged, releases/latest stayed at v0.4.0, and installed
      # apps never saw anything newer ("update nahi aa raha"). From now
      # on the pubspec.yaml version IS the release: bump it, push to main,
      # and when the matching v<version> tag does not exist yet this run
      # creates the tag + Release + APK itself. No manual tagging, ever.
      # Checked AFTER the build so a run that started earlier and is still
      # publishing cannot be double-released (concurrency group queues us).
      - name: Resolve auto-release (version tag missing?)
        id: rel
        if: github.ref == 'refs/heads/main'
        run: |
          VER="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+.*/\1/p' pubspec.yaml)"
          echo "pubspec version: $VER"
          if [ -z "$VER" ]; then
            echo "::error::Could not parse version from pubspec.yaml"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v$VER" > /dev/null 2>&1; then
            echo "Tag v$VER already exists - release already published, skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$VER is missing - release will be published from this build."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=v$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release (tag push, or auto on version bump)
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.ref == 'refs/heads/main' && steps.rel.outputs.should_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.release_tag || github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
