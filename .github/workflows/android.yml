name: Android CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Pinned so CI matches the locally tested SDK exactly.
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Flutter version
        run: flutter --version

      # If the android/ platform folder has not been committed yet
      # (bootstrap step on a fresh clone), generate it with our config.
      - name: Ensure android platform folder
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms android --project-name ruby_invoice --org com.rubyinvoice
            bash tool/apply_android_config.sh
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact (every build)
        uses: actions/upload-artifact@v4
        with:
          name: ruby-invoice-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
