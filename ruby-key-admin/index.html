<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ruby Key - Admin</title>
  <meta name="description" content="Ruby Key - admin panel for Ruby Invoice: users, trials, subscriptions, devices." />
  <meta name="theme-color" content="#9B111E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ruby Key" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <div class="boot">
      <div class="boot-logo">R</div>
      <div class="boot-title">RUBY KEY</div>
      <div class="boot-sub">Admin panel - loading...</div>
    </div>
  </div>
  <noscript>Ruby Key needs JavaScript. Please enable it and reload.</noscript>
  <script src="./firebase-config.js"></script>
  <script type="module" src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
